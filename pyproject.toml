[project]
name = "crm-ml-hybrid"
version = "0.2.0"
description = "CRM-ML hybrid production forecasting (after Ogali & Orodu, 2025) - single-file program main.py"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "xgboost>=2.0",
    "streamlit>=1.30",
]

[tool.uv]
package = false   # scripts-only project: no build backend needed