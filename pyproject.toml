[project]
name = "crm-ml-hybrid"
version = "0.1.0"
description = "CRM-ML hybrid production forecasting (after Ogali & Orodu, 2025) with paper-style charts and a Streamlit GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "streamlit>=1.65.0",
]

[project.optional-dependencies]
gui = ["streamlit>=1.30"]
xgb = ["xgboost>=2.0"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false   # scripts-only project: no build backend needed
